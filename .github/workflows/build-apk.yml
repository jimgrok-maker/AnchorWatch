name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: make_icons.py is deterministic — it paints the launcher icon from a fixed
      # formula and writes the same PNGs every run. If the icon is committed to the repo
      # (app/src/main/res/mipmap-*/ic_launcher*.png and res/drawable/ic_launcher_foreground.png),
      # this Python step can be removed to save ~10-20s of network + Pillow work per build.
      # It is kept here so the icon is always regenerated from source. PNGs are not committed.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paint launcher icon
        run: |
          pip install --quiet pillow
          python app/icons/make_icons.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnchorWatch
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
